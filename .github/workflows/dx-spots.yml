name: Aggiorna DX Cluster
on:
  push:
    branches: [main]
    paths:
      - 'scripts/collect_dx.py'
      - '.github/workflows/dx-spots.yml'
  schedule:
    # GitHub scheduling is best-effort; shifted away from the hour boundary.
    - cron: '4-59/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dx-cluster-update
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Verifica sintassi collector
        run: python3 -m py_compile scripts/collect_dx.py
      - name: Raccogli spot pubblici
        run: python3 scripts/collect_dx.py
      - name: Salva dati aggiornati
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dx-spots.json
          if ! git diff --cached --quiet; then
            git commit -m "Aggiorna spot DX pubblici"
            git push
          fi
      - name: Controlla stato delle fonti DX
        run: |
          python3 - <<'PY'
          import json, sys
          with open('data/dx-spots.json', encoding='utf-8') as f:
              d = json.load(f)
          print('Spot nuovi:', d.get('new_spots', 0))
          print('Stato:', d.get('status'))
          print('Fonti OK:', ', '.join(d.get('sources_ok', [])))
          if d.get('status') == 'unavailable':
              print('Nessuna fonte raggiungibile:', d.get('errors', []), file=sys.stderr)
              sys.exit(1)
          PY
