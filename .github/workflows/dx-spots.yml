name: Aggiorna DX Cluster
on:
  push:
    branches: [main]
    paths:
      - 'scripts/collect_dx.py'
      - '.github/workflows/dx-spots.yml'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dx-cluster-update
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Verifica sintassi collector
        run: python3 -m py_compile scripts/collect_dx.py
      - name: Raccogli spot pubblici
        run: python3 scripts/collect_dx.py
      - name: Salva dati aggiornati
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dx-spots.json
          if ! git diff --cached --quiet; then
            git commit -m "Aggiorna spot DX pubblici"
            git push
          fi
